version: "3.8"

services:
  dpvg:
    build: .
    container_name: dpvg-gateway
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DPVG_OLLAMA_URL=http://host.docker.internal:11434
      - DOCKER_CONTAINER=true
    extra_hosts:
      # Allows the Docker container on Linux/macOS/Windows to reach host machine services
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
